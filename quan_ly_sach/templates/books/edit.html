
{% extends "base.html" %}

{% block title %}Sửa sách{% endblock %}

{% block content %}

<h2 class="mb-4">Chỉnh sửa sách</h2>

<div class="card border-0 shadow-sm">
    <div class="card-body">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Tên sách</label>
                <input type="text"
                       name="title"
                       class="form-control"
                       value="{{ book.title }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Tác giả</label>
                <input type="text"
                       name="author"
                       class="form-control"
                       value="{{ book.author }}"
                       required>
            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Giá sách</label>
                    <input type="number"
                           name="price"
                           class="form-control"
                           min="0"
                           step="1000"
                           value="{{ book.price }}"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Số lượng</label>
                    <input type="number"
                           name="quantity"
                           class="form-control"
                           min="0"
                           value="{{ book.quantity }}"
                           required>
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label">Danh mục</label>

                <select name="category_id" class="form-select" required>

                    {% for category in categories %}
                    <option value="{{ category.id }}"
                        {% if book.category_id == category.id %}
                            selected
                        {% endif %}>
                        {{ category.name }}
                    </option>
                    {% endfor %}

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Mô tả</label>
                <textarea name="description"
                          class="form-control"
                          rows="4">{{ book.description or "" }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Cập nhật
            </button>

            <a href="{{ url_for('books') }}" class="btn btn-secondary">
                Quay lại
            </a>

        </form>

    </div>
</div>

{% endblock %}
