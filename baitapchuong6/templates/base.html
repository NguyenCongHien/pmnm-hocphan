
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Quản lý sinh viên{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f4f6f9;
        }

        .container {
            max-width: 1100px;
        }

        .card {
            border: none;
            border-radius: 12px;
        }

        .section-title {
            color: #0d6efd;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Thanh điều hướng -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                Quản lý sinh viên
            </a>
        </div>
    </nav>

    <!-- Nội dung từng trang sẽ được đặt tại đây -->
    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
