
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Ứng dụng Flask{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f3f6fb;
            color: #263449;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(120deg, #1456c0, #287cf0);
            box-shadow: 0 3px 12px rgba(20, 86, 192, 0.15);
        }

        .navbar-brand {
            font-size: 1.3rem;
            letter-spacing: 0.3px;
        }

        .navbar .nav-link {
            color: rgba(255, 255, 255, 0.85);
            padding: 10px 14px;
            margin: 0 3px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            background: rgba(255, 255, 255, 0.17);
            color: white;
        }

        .main-content {
            max-width: 820px;
            margin: 45px auto;
            min-height: 65vh;
        }

        .card {
            border: 1px solid #e8edf5;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(31, 55, 90, 0.07);
            overflow: hidden;
        }

        .card-body {
            padding: 35px;
        }

        .page-icon {
            width: 64px;
            height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e8f1ff;
            color: #1764d8;
            border-radius: 18px;
            font-size: 30px;
            margin: 0 auto 16px;
        }

        .form-label {
            color: #33445d;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            padding: 12px 14px;
            border: 1px solid #dce4ef;
            border-radius: 10px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #4388f5;
            box-shadow: 0 0 0 0.2rem rgba(40, 124, 240, 0.13);
        }

        .btn {
            padding: 11px 18px;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-primary {
            background: #216de0;
            border-color: #216de0;
        }

        .btn-primary:hover {
            background: #1557bc;
            border-color: #1557bc;
        }

        .result-box {
            border: none;
            border-radius: 14px;
            padding: 22px;
        }

        .footer {
            color: #8793a5;
            text-align: center;
            padding: 22px 12px;
            font-size: 0.9rem;
        }

        @media (max-width: 576px) {
            .main-content {
                margin: 25px auto;
            }

            .card-body {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>
    <!-- Thanh điều hướng -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-grid-1x2-fill me-2"></i>
                Flask Practice
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainMenu"
                aria-controls="mainMenu"
                aria-expanded="false"
                aria-label="Mở menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainMenu">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="/">
                        <i class="bi bi-house-door me-1"></i> Trang chủ
                    </a>

                    <a class="nav-link" href="/calculator">
                        <i class="bi bi-calculator me-1"></i> Máy tính
                    </a>

                    <a class="nav-link" href="/grade">
                        <i class="bi bi-journal-check me-1"></i> Tính điểm
                    </a>

                    <a class="nav-link" href="/bmi">
                        <i class="bi bi-heart-pulse me-1"></i> BMI
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Nội dung từng trang -->
    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Chân trang -->
    <footer class="footer">
        <div>Ứng dụng thực hành Flask & Bootstrap</div>
        <div class="mt-1">Chương 5 — Form và xử lý dữ liệu người dùng</div>
        <div class="mt-1">Dưới sự hổ trợ từ AI</div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
